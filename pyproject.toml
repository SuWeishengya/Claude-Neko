[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-neko"
version = "0.1.0"
description = "A desktop pet for Claude Code — a little cat that shows Claude's working status"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "SuWeisheng", email = "suweishengya@gmail.com"},
]
keywords = ["claude", "desktop-pet", "gtk", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pillow>=10.0",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# PyGObject and pycairo are system-level packages, install via:
#   Fedora: sudo dnf install python3-gobject python3-cairo gtk3
#   Ubuntu: sudo apt install python3-gi python3-cairo gir1.2-gtk-3.0
#   Arch:   sudo pacman -S python-gobject python-cairo gtk3
gtk = [
    "PyGObject>=3.42",
    "pycairo>=1.20",
]

[project.urls]
Homepage = "https://github.com/SuWeishengya/Claude-Neko"
Repository = "https://github.com/SuWeishengya/Claude-Neko"
Issues = "https://github.com/SuWeishengya/Claude-Neko/issues"

[tool.setuptools.packages.find]
include = ["*.py"]

[tool.setuptools.package-data]
"*" = ["assets/**/*.png", "config.json", "*.sh", "neko"]
